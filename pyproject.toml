[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "megatron"
version = "1.0.0"
description = "Time series forecasting toolkit"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Andrei Safonov", email = "andrei.saf.uk@gmail.com" }]
keywords = ["timeseries", "forecasting", "python"]
dependencies = [
    "feature-engine",
    "holidays==0.46", # most stable version for Prophet library to import country holidays dictionary
    "joblib",
    "lightgbm",
    "numpy",
    "optuna",
    "pandas",
    "plotly",
    "prophet",
    "pyarrow",
    "pycatch22",
    "pyod",
    "ruptures",
    "scikit-learn",
    "scipy",
    "sktime",
    "statsforecast",
    "statsmodels",
    "tqdm_joblib",
]

[project.urls]
homepage = "https://github.com/irressaf/ts-enterprise"

[tool.hatch.build.targets.wheel]
packages = ["src/megatron"]

[tool.hatch.envs.default]
python = "3.13"

[tool.hatch.envs.default.scripts]
process = "python scripts/process_raw_data.py"
forecast = "python scripts/train_and_forecast.py"
fit-all = ["process", "forecast"]

[tool.hatch.envs.test]
python = "3.13"
dependencies = ["pytest", "pytest-cov"]

[tool.hatch.envs.test.scripts]
unit = "pytest -m unit"
integration = "pytest -m integration"
data-quality = "pytest -m data_quality --no-cov"
fast = "pytest -m 'unit or integration'"
all = ["fast", "data-quality"]
cov-html = "pytest -m 'unit or integration' --cov-report=html"

[tool.hatch.envs.lint]
detached = true
dependencies = ["ruff"]

[tool.hatch.envs.lint.scripts]
check = ["ruff format --check .", "ruff check ."]
fmt = ["ruff format .", "ruff check --fix ."]

[tool.hatch.envs.notebook]
python = "3.13"
dependencies = ["ipython", "ipykernel", "nbformat"]

[tool.hatch.envs.notebook.scripts]
register-kernel = "python -m ipykernel install --user --name megatron --display-name 'kernel (Python 3.13.11)'"

[tool.hatch.envs.precommit]
detached = true
dependencies = ["pre-commit"]

[tool.hatch.envs.precommit.scripts]
install = "pre-commit install"
run = "pre-commit run --all-files"
update = "pre-commit autoupdate"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
addopts = "--cov=megatron --cov-report=term-missing --strict-markers"
markers = [
    "unit: unit tests for individual components",
    "integration: integration tests across project modules",
    "data_quality: data validation tests for project datasets",
]

[tool.coverage.run]
source = ["megatron"]
omit = ["*/__init__.py"]
branch = true

[tool.coverage.report]
fail_under = 80
